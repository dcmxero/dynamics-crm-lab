name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build and tests
    # Windows because the plug-in targets .NET Framework 4.6.2.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DynamicsCrmLab.sln

      - name: Build
        run: dotnet build DynamicsCrmLab.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DynamicsCrmLab.sln --configuration Release --no-build --verbosity normal

  pcf:
    name: PCF build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pcf/WorkOrderStatusTrack

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pcf/WorkOrderStatusTrack/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build
